[colors]
background = #2E3440
surface = #3B4252
foreground = #ECEFF4
muted = #D8DEE9
primary = #88C0D0
blue = #81A1C1
green = #A3BE8C
purple = #B48EAD
red = #BF616A

[bar/main]
width = 100%
height = 34
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = DejaVu Sans:size=10;3
font-1 = FontAwesome:size=12;3
modules-left = launcher i3
modules-center = date
modules-right = pulseaudio cpu memory tray power
padding-left = 1
padding-right = 1
module-margin = 1
line-size = 2
border-bottom-size = 1
border-bottom-color = ${colors.surface}
monitor = ${env:MONITOR:}
monitor-fallback = LVDS-1
screenchange-reload = true
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/launcher]
type = custom/text
format = %{T2}%{T-}
format-foreground = ${colors.primary}
format-padding = 1
click-left = rofi -show drun

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode = %mode%
label-mode-background = ${colors.surface}
label-mode-padding = 1
label-focused = %index%
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.surface}
label-focused-underline = ${colors.primary}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2
label-visible = %index%
label-visible-foreground = ${colors.blue}
label-visible-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}
ramp-volume-foreground = ${colors.primary}
label-muted = %{T2}%{T-} mudo
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 5
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.purple}
label = %percentage_used:2%%

[module/date]
type = internal/date
interval = 1
date = %d/%m
time = %H:%M
label = %{T2}%{T-} %date%  %{F#88C0D0}·%{F-}  %{T2}%{T-} %time%
label-foreground = ${colors.foreground}

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 18px

[module/power]
type = custom/text
format = %{T2}%{T-}
format-foreground = ${colors.red}
format-padding = 1
click-left = bash "/home/glover/setup-voidlinux/scripts/power-menu.sh"
