[colors]
background = #2E3440
foreground = #ECEFF4
primary = #88C0D0
muted = #4C566A
[bar/main]
width = 100%
height = 28
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = monospace:size=10;2
modules-left = i3
modules-right = cpu memory date
tray-position = right
[module/i3]
type = internal/i3
label-focused = %index%
label-focused-foreground = ${colors.primary}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2
[module/cpu]
type = internal/cpu
interval = 5
label = CPU %percentage%%
[module/memory]
type = internal/memory
interval = 5
label = RAM %percentage_used%%
[module/date]
type = internal/date
interval = 30
date = %d/%m %H:%M
label = %date%
